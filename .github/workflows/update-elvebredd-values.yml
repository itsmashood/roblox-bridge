name: Update Elvebredd Values (Owner Snapshot)

on:
  workflow_dispatch:
  schedule:
    # Owner's snapshot is generated at 00:00 and 12:00 UTC.
    # Allow time for it to publish before we fetch it.
    - cron: '35 1,13 * * *'

permissions:
  contents: write

concurrency:
  group: update-elve-values
  cancel-in-progress: false

jobs:
  update-values:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run validation tests
        run: |
          node --check update_elvebredd_values.js
          node --check scripts/scrape-elve.js
          node --test test_updater.js
      - name: Import owner-published Elvebredd values
        run: node update_elvebredd_values.js
      - name: Validate updated DB
        run: node scripts/verify-db.js
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: elve-update-diagnostics
          path: elve-update-diagnostics.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit only when values change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp values_elvebredd "$RUNNER_TEMP/values_elvebredd"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/values_elvebredd" values_elvebredd
            git add -- values_elvebredd
            if git diff --cached --quiet; then
              echo 'No value changes to commit.'
              exit 0
            fi
            git diff --cached --check
            git commit -m 'Update Elvebredd values from owner snapshot'
            git push origin HEAD:main && exit 0
            echo 'Push failed, retrying...'
            sleep 5
          done
          exit 1
