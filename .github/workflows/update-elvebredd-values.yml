name: Update Elvebredd Values

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-values:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update values from Elvebredd
        run: node update_elvebredd_values.js

      - name: Commit updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values_elvebredd
          git status --short
          if git diff --cached --quiet; then
            echo "No values_elvebredd changes to commit."
          else
            git commit -m "Update Elvebredd values"
            git push
          fi
